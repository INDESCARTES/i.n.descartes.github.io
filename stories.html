<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Room | The Descartes Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400;1,700&family=EB+Garamond:ital@0;1&family=Montserrat:wght@500;600&family=Special+Elite&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  /* ================= BRAND COLORS (from your brand kit) ================= */
  :root{
    --burgundy:#5c1a24; --red:#8e2a3b; --pink:#f3d7dc; --cream:#faf4ea; --paper:#fffbf1;
    --sage:#a9bf95; --crimson:#d33043; --ink:#f4eadb; --ink-muted:#c7b3a8; --link:#eba3af;
    --room:#140d0b; --raised:#261b18; --hairline:#4a3235; --label-ink:#2a1418;
    --typed:"Special Elite","Courier New",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--room);color:var(--ink);font-family:"EB Garamond",Garamond,Georgia,serif;font-size:21px;line-height:1.7}

  /* ================= RUNNER BANNER ================= */
  .runner{background:var(--burgundy);color:var(--pink);overflow:hidden;white-space:nowrap;padding:14px 0}
  .runner-track{display:inline-block;animation:run 40s linear infinite;font-family:"Bodoni Moda",Didot,serif;font-style:italic;font-weight:700;font-size:24px;letter-spacing:.03em}
  .glyph{font-family:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",serif;font-style:normal;color:var(--sage);padding:0 24px}
  @keyframes run{to{transform:translateX(-50%)}}

  main{max-width:1240px;margin:0 auto;padding:56px 32px 80px}
  h1{font-family:"Bodoni Moda",Didot,serif;font-weight:400;font-size:clamp(44px,7vw,72px);line-height:1.05;margin:0;color:var(--pink);text-align:center}
  .lede{font-family:Montserrat,Arial,sans-serif;font-weight:500;font-size:19px;color:var(--link);text-align:center;margin:12px auto 32px;max-width:640px;line-height:1.5}

  /* ================= HOME BASE: 3D TAPE RECORDER ================= */
  .room{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:center}
  @media (max-width:900px){.room{grid-template-columns:1fr;gap:24px}}
  .deck{position:relative;width:100%;aspect-ratio:4/3;cursor:default;outline:none}
  .deck:focus-visible .deck-hint{color:var(--pink);text-decoration:underline}
  .deck canvas{display:block;width:100%!important;height:100%!important;-webkit-mask-image:radial-gradient(closest-side,#000 74%,transparent 100%);mask-image:radial-gradient(closest-side,#000 74%,transparent 100%)}
  .deck-hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--typed);font-size:16px;color:var(--ink-muted);pointer-events:none}
  .deck.no-webgl{display:grid;place-items:center;background:var(--raised);border:2px solid var(--hairline);border-radius:4px;font-family:Montserrat,sans-serif;font-size:16px;padding:24px;text-align:center}

  .player{display:flex;flex-direction:column;gap:20px}
  .now{font-family:Montserrat,sans-serif;font-weight:600;font-size:14px;letter-spacing:.35em;text-transform:uppercase;color:var(--link)}
  .story-title{font-family:"Bodoni Moda",Didot,serif;font-weight:400;font-size:clamp(32px,4vw,44px);line-height:1.1;margin:0;color:var(--pink);text-transform:lowercase}
  .story-blurb{margin:0}
  .btn{position:relative;border:0;border-radius:999px;cursor:pointer;font-family:Montserrat,sans-serif;font-weight:600;letter-spacing:.02em;color:var(--cream);background:var(--burgundy);padding:18px 42px;font-size:20px;min-height:58px;transition:background .2s,transform .1s}
  .btn:hover{background:var(--red)}
  .btn:focus-visible,.tape:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
  .progress{display:flex;align-items:center;gap:14px;font-family:var(--typed);font-size:18px;color:var(--ink-muted)}
  input[type=range]{flex:1;accent-color:var(--link);height:28px;cursor:pointer}
  .error{font-family:Montserrat,sans-serif;font-size:15px;color:var(--link);min-height:1em;margin:0}

  /* ================= LOW-POLY CASSETTE CAROUSEL ================= */
  .shelf-title{font-family:"Bodoni Moda",Didot,serif;font-weight:400;font-size:clamp(30px,4vw,40px);color:var(--pink);margin:80px 0 0;text-align:center}
  .shelf-sub{font-family:var(--typed);font-size:18px;color:var(--ink-muted);text-align:center;margin:4px 0 0}
  .hint-touch{display:none} @media (hover:none){.hint-mouse{display:none}.hint-touch{display:inline}}
  .carousel-wrap{display:flex;align-items:center;gap:12px;margin-top:8px}
  .carousel{flex:1;display:flex;gap:36px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:70px 24px 40px;scrollbar-width:thin;scrollbar-color:var(--red) transparent}
  .arrow{flex:none;width:58px;height:58px;padding:0;font-size:22px}
  @media (max-width:640px){.arrow{display:none}.carousel{gap:20px;padding:60px 8px 30px}}

  .tape{position:relative;flex:none;width:280px;scroll-snap-align:center;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left}
  .tape-stage{height:200px;display:grid;place-items:center;perspective:900px;position:relative}
  .float{transition:transform .35s ease;transform-style:preserve-3d}
  .spinner{position:relative;width:240px;height:150px;transform-style:preserve-3d;transform:rotateX(8deg) rotateY(-18deg)}
  .face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face svg{display:block}
  .f-front,.f-back{left:0;top:0;width:240px;height:150px}
  .f-front{transform:translateZ(13px)} .f-back{transform:rotateY(180deg) translateZ(13px)}
  .f-top,.f-bottom{left:0;top:62px;width:240px;height:26px}
  .f-top{transform:rotateX(90deg) translateZ(75px)} .f-bottom{transform:rotateX(-90deg) translateZ(75px)}
  .f-left,.f-right{left:107px;top:0;width:26px;height:150px}
  .f-right{transform:rotateY(90deg) translateZ(120px)} .f-left{transform:rotateY(-90deg) translateZ(120px)}
  .tape-label{position:absolute;left:10%;right:10%;top:9%;height:30%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--typed);font-size:16px;line-height:1.1;color:var(--label-ink);overflow:hidden}
  .hub{transform-box:fill-box;transform-origin:center}
  .tape-shadow{position:absolute;left:50%;bottom:4px;width:190px;height:18px;margin-left:-95px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(6px);transition:all .35s}
  .tape-info{margin-top:6px;background:var(--raised);border:2px solid var(--hairline);border-radius:4px;padding:16px 18px;transition:border-color .3s}
  .tape-title{font-family:"Bodoni Moda",Didot,serif;font-size:23px;line-height:1.15;color:var(--pink);text-transform:lowercase;margin:0 0 6px}
  .tape-desc{font-size:18px;line-height:1.45;margin:0}
  .tape-cta{font-family:var(--typed);font-size:16px;color:var(--link);margin-top:10px;display:block}
  .tape[aria-current="true"] .tape-info{border-color:var(--sage)}

  /* hover / focus: float closer, bob, spin */
  .tape:hover,.tape:focus-visible{z-index:50}
  .tape:hover .float,.tape:focus-visible .float{animation:bob 1.6s ease-in-out infinite}
  .tape:hover .spinner,.tape:focus-visible .spinner{animation:turn 3.6s linear infinite}
  .tape:hover .hub,.tape:focus-visible .hub{animation:reel 1.4s linear infinite}
  .tape:hover .tape-shadow,.tape:focus-visible .tape-shadow{animation:shadowbob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(-22px) scale(1.18)}50%{transform:translateY(-38px) scale(1.18)}}
  @keyframes turn{from{transform:rotateX(8deg) rotateY(0)}to{transform:rotateX(8deg) rotateY(360deg)}}
  @keyframes reel{to{transform:rotate(360deg)}}
  @keyframes shadowbob{0%,100%{transform:scale(.85);background:rgba(10,6,6,.55)}50%{transform:scale(.65);background:rgba(10,6,6,.4)}}
  .dimmer{position:fixed;inset:0;background:rgba(5,3,3,.7);opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
  body.dim .dimmer{opacity:1}
  .empty{font-family:var(--typed);font-size:18px;color:var(--ink-muted);text-align:center;padding:40px 0;width:100%}

  .signoff{font-family:Montserrat,sans-serif;font-weight:600;font-size:17px;color:var(--link);text-align:center;margin-top:56px}
  @media (max-width:500px){main{padding:40px 16px 64px}}
  @media (prefers-reduced-motion:reduce){
    .runner-track,.tape:hover .spinner,.tape:hover .tape-shadow,.tape:hover .hub{animation:none}
    .tape:hover .float,.tape:focus-visible .float{animation:none;transform:translateY(-22px) scale(1.12)}
  }
</style>
</head>
<body>
<div class="dimmer" aria-hidden="true"></div>
<div class="runner" aria-hidden="true"><span class="runner-track" id="runner"></span></div>

<main>
  <h1>The Listening Room</h1>
  <p class="lede">Pick a tape, press play, and listen to a story read aloud. Best with headphones and the lights off.</p>

  <section class="room">
    <div class="deck" id="deck" tabindex="0" role="group" aria-label="Tape recorder. Press Space to play or pause, the left and right arrow keys to skip 15 seconds, and E to stop and eject.">
      <span class="deck-hint">press the keys on the recorder</span>
    </div>
    <div class="player">
      <span class="now">Now playing</span>
      <h2 class="story-title" id="storyTitle">loading the shelf…</h2>
      <p class="story-blurb" id="storyBlurb"></p>
      <div class="progress">
        <span id="cur">0:00</span>
        <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Story progress">
        <span id="dur">0:00</span>
      </div>
      <p class="error" id="error" role="status"></p>
    </div>
  </section>

  <h2 class="shelf-title">Choose a tape</h2>
  <p class="shelf-sub"><span class="hint-mouse">hover to take a closer look</span><span class="hint-touch">tap a tape to play it</span></p>
  <div class="carousel-wrap">
    <button class="btn arrow" id="prevBtn" type="button" aria-label="Previous tapes">&lt;</button>
    <div class="carousel" id="carousel"></div>
    <button class="btn arrow" id="nextBtn" type="button" aria-label="Next tapes">&gt;</button>
  </div>

  <p class="signoff">xoxo, descartes</p>
</main>

<script type="module">
/* =====================================================================
   SETTINGS
   The page finds your stories by itself: it reads every audio file in the
   "audio" folder of your GitHub repo. You never need to edit this file
   to add a story.
   ===================================================================== */
const SETTINGS = {
  githubUser: "INDESCARTES",
  repo: "i.n.descartes.github.io",
  folder: "audio",
  tapeColors: ["#5c1a24", "#8e2a3b", "#6d7b4f", "#4d364b", "#d33043", "#726756"],
};
/* Backup list, only used if GitHub can't be reached:
   { title: "Title", file: "audio/01-title.mp3", blurb: "Two sentences." },  */
const BACKUP_STORIES = [];

import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const colorFor = i => SETTINGS.tapeColors[i % SETTINGS.tapeColors.length];
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); const ch = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f))); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }

/* ================= loading stories from the audio folder ================= */
const AUDIO_TYPES = /\.(mp3|m4a|wav|ogg|aac)$/i;
const titleFromFile = n => n.replace(AUDIO_TYPES, "").replace(/^\d+[\s._-]*/, "").replace(/[-_]+/g, " ").trim();

async function loadStories() {
  if (window.PREVIEW_STORIES) return window.PREVIEW_STORIES;
  const key = "descartes-stories-v1";
  try { const c = sessionStorage.getItem(key); if (c) return JSON.parse(c); } catch (e) {}
  try {
    const res = await fetch(`https://api.github.com/repos/${SETTINGS.githubUser}/${SETTINGS.repo}/contents/${SETTINGS.folder}`);
    if (!res.ok) throw new Error(res.status);
    const names = (await res.json()).map(f => f.name);
    const audioFiles = names.filter(n => AUDIO_TYPES.test(n)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    const stories = await Promise.all(audioFiles.map(async name => {
      const base = name.replace(AUDIO_TYPES, "");
      const s = { title: titleFromFile(name), file: `${SETTINGS.folder}/${encodeURIComponent(name)}`, blurb: "" };
      if (names.includes(base + ".txt")) {
        try {
          const lines = (await (await fetch(`${SETTINGS.folder}/${encodeURIComponent(base + ".txt")}`)).text()).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (lines[0]) s.title = lines[0];
          s.blurb = lines.slice(1).join(" ");
        } catch (e) {}
      }
      return s;
    }));
    try { sessionStorage.setItem(key, JSON.stringify(stories)); } catch (e) {}
    return stories;
  } catch (e) { return BACKUP_STORIES; }
}

/* ===================================================================
   THE 3D TAPE RECORDER (three.js)
   =================================================================== */
let isPlaying = false, fastSpin = 0, fastDir = 1;
const audio = new Audio(); audio.preload = "metadata";
let deck = { insert: () => Promise.resolve(), eject: () => Promise.resolve(), close: () => Promise.resolve(), isEjected: () => false, tap: () => {} };

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.userData.canvas = c; return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);
function brushed(g, w, h, base) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < h * 2; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? "255,255,255" : "0,0,0"},${rnd(.015, .06)})`; g.fillRect(rnd(-w, w), rnd(0, h), w * rnd(.3, 1.2), 1); }
  g.lineCap = "round";
  for (let i = 0; i < 26; i++) { g.strokeStyle = `rgba(30,25,25,${rnd(.08, .22)})`; g.lineWidth = rnd(.5, 1.6); const x = rnd(0, w), y = rnd(0, h); g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-60, 60), y + rnd(-14, 14)); g.stroke(); }
}
function scuffed(g, w, h, base) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${rnd(0, .035)})`; g.fillRect(rnd(0, w), rnd(0, h), 1.5, 1.5); }
  for (let i = 0; i < 70; i++) { g.strokeStyle = `rgba(200,195,195,${rnd(.04, .14)})`; g.lineWidth = rnd(.5, 2); const x = rnd(0, w), y = rnd(0, h); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + rnd(-40, 40), y + rnd(-40, 40), x + rnd(-90, 90), y + rnd(-30, 30)); g.stroke(); }
  for (let i = 0; i < 12; i++) { const x = rnd(0, w), y = rnd(0, h), r = rnd(10, 40); const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, "rgba(160,150,150,.07)"); gr.addColorStop(1, "rgba(160,150,150,0)"); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

async function initDeck() {
  const el = $("deck");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { el.classList.add("no-webgl"); el.textContent = "Your browser can't show the 3D tape recorder. Pick a tape below and it will still play."; return; }
  await Promise.race([Promise.all(['400 80px "Bodoni Moda"', '600 30px Montserrat', '40px "Special Elite"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).catch(() => {});

  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.setClearColor(0x140d0b);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  el.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x140d0b); scene.fog = new THREE.Fog(0x140d0b, 42, 78);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const camera = new THREE.PerspectiveCamera(30, 4 / 3, 1, 200);
  camera.position.set(1, 30, 37); camera.lookAt(0.5, -0.8, 1.2);

  // a warm desk lamp, just out of frame, makes a pool of light in a dark room
  const lamp = new THREE.SpotLight(0xffc98a, 3.6, 0, 0.5, 1, 0); lamp.position.set(-12, 30, 6); lamp.target.position.set(0, 0, 1);
  lamp.castShadow = true; lamp.shadow.mapSize.set(2048, 2048); lamp.shadow.radius = 6; lamp.shadow.bias = -0.0004; lamp.shadow.normalBias = 0.03;
  lamp.shadow.camera.near = 5; lamp.shadow.camera.far = 80; scene.add(lamp, lamp.target);
  const rimL = new THREE.DirectionalLight(0xf3d7dc, 0.45); rimL.position.set(18, 8, -16); scene.add(rimL);
  scene.add(new THREE.HemisphereLight(0xffe2c4, 0x140d0b, 0.06));

  // the wooden desk
  const woodTex = canvasTex(2048, 1024, (g, w, h) => {
    const planks = 4, ph = h / planks, tones = ["#94502a", "#8a4822", "#9c5a2e", "#86441f"];
    for (let p = 0; p < planks; p++) {
      g.fillStyle = tones[p % tones.length]; g.fillRect(0, p * ph, w, ph);
      for (let i = 0; i < 70; i++) {
        const y0 = p * ph + rnd(0, ph), amp = rnd(2, 9), f = rnd(.002, .006), ph0 = rnd(0, 6);
        g.strokeStyle = Math.random() < .7 ? `rgba(70,28,8,${rnd(.08, .28)})` : `rgba(210,140,80,${rnd(.05, .14)})`; g.lineWidth = rnd(.6, 3.2);
        g.beginPath(); for (let x = 0; x <= w; x += 16) { const y = y0 + Math.sin(x * f + ph0) * amp + Math.sin(x * f * 3.1) * amp * .3; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
      }
      for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(40,15,5,${rnd(.08, .25)})`; g.fillRect(rnd(0, w), p * ph + rnd(0, ph), rnd(3, 12), 1); }
      if (Math.random() < .6) { const kx = rnd(200, w - 200), ky = p * ph + rnd(40, ph - 40); for (let r = 4; r < 46; r += 5) { g.strokeStyle = `rgba(60,22,6,${.35 - r / 180})`; g.lineWidth = 2; g.beginPath(); g.ellipse(kx, ky, r * 2.4, r * .7, 0, 0, 7); g.stroke(); } }
      g.fillStyle = "rgba(25,10,4,.65)"; g.fillRect(0, p * ph, w, 3);
    }
    const sheen = g.createLinearGradient(0, 0, w, h); sheen.addColorStop(0, "rgba(255,220,180,.04)"); sheen.addColorStop(1, "rgba(0,0,0,.06)"); g.fillStyle = sheen; g.fillRect(0, 0, w, h);
  });
  woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(2, 1.6);
  const deskMat = new THREE.MeshPhysicalMaterial({ map: woodTex, roughness: 0.48, clearcoat: 0.45, clearcoatRoughness: 0.35, envMapIntensity: 0.15 });
  const desk = new THREE.Mesh(new THREE.BoxGeometry(120, 2.4, 58), deskMat);
  desk.position.set(0, -3.7, -12); desk.receiveShadow = true; scene.add(desk);

  const rig = new THREE.Group(); rig.rotation.y = -0.22; scene.add(rig);
  const add = (geo, mat, x, y, z, parent = rig) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };

  /* ---- materials ---- */
  const plasticMap = canvasTex(1024, 1024, (g, w, h) => scuffed(g, w, h, "#1d1b1c"));
  const plastic = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: plasticMap, roughness: 0.55, clearcoat: 0.25, clearcoatRoughness: 0.55 });
  const plasticDark = new THREE.MeshPhysicalMaterial({ color: 0x0c0b0b, roughness: 0.8 });
  const metalTex = canvasTex(1024, 256, (g, w, h) => brushed(g, w, h, "#c4c3c6"));
  const metal = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: metalTex, metalness: 0.9, roughness: 0.3, clearcoat: 0.15 });
  const rubber = new THREE.MeshStandardMaterial({ color: 0x121112, roughness: 0.95 });
  const glass = new THREE.MeshPhysicalMaterial({ color: 0x3a3436, metalness: 0, roughness: 0.06, transparent: true, opacity: 0.3, clearcoat: 1, envMapIntensity: 0.9 });
  [plastic, plasticDark, metal, rubber].forEach(m => (m.envMapIntensity = 0.45));

  /* ---- body ---- */
  add(new RoundedBoxGeometry(24, 4.2, 15, 5, 0.6), plastic, 0, 0, 0);
  add(new RoundedBoxGeometry(24.06, 0.07, 15.06, 2, 0.6), plasticDark, 0, -0.5, 0); // shell seam
  add(new THREE.BoxGeometry(17, 1.25, 0.12), metal, -1.5, -1.0, 7.53);                 // front trim
  add(new RoundedBoxGeometry(1.4, 0.55, 0.4, 2, 0.12), plasticDark, 4.5, -1.0, 7.65);  // volume slider

  /* ---- speaker grille ---- */
  const grilleTex = canvasTex(1536, 256, (g, w, h) => {

  });
  add(new THREE.BoxGeometry(22.4, 0.1, 3.7), new THREE.MeshPhysicalMaterial({ map: grilleTex, roughness: 0.6, metalness: 0.3 }), 0, 2.12, -5.15);

  /* ---- cassette bay, bezel and lid ---- */
  add(new THREE.BoxGeometry(11.6, 0.9, 0.4), plastic, -5.6, 2.55, -3.3);
  add(new THREE.BoxGeometry(11.6, 0.9, 0.3), plastic, -5.6, 2.55, 3.2);
  add(new THREE.BoxGeometry(0.4, 0.9, 6.8), plastic, -11.2, 2.55, -0.05);
  add(new THREE.BoxGeometry(0.4, 0.9, 6.8), plastic, 0.0, 2.55, -0.05);
  add(new THREE.BoxGeometry(10.8, 0.04, 6.4), plasticDark, -5.6, 2.12, 0.1);
  const lid = new THREE.Group(); lid.position.set(-5.6, 3.0, -3.5); rig.add(lid);
  const lidParts = [
    add(new THREE.BoxGeometry(11.6, 0.28, 0.9), plastic, 0, 0.14, 0.45, lid),

    add(new THREE.BoxGeometry(0.9, 0.28, 5.1), plastic, 5.35, 0.14, 3.45, lid),
    add(new THREE.BoxGeometry(9.8, 0.1, 5.1), glass, 0, 0.2, 3.45, lid),
    add(new RoundedBoxGeometry(4, 0.14, 0.35, 2, 0.06), plasticDark, 0, 0.33, 6.6, lid),
  ];
  lidParts[4].castShadow = false;

  /* ---- brand plate, counter, power light ---- */
  const plateTex = canvasTex(1024, 660, (g, w, h) => {
    brushed(g, w, h, "#c4c3c6");
    g.fillStyle = "#2a1418"; g.font = '400 84px "Bodoni Moda", Didot, serif'; g.fillText("Descartes", 56, 130);
    g.font = '600 26px Montserrat, Arial, sans-serif'; g.fillText("PORTABLE CASSETTE RECORDER", 60, 182);
    g.fillStyle = "#5c1a24"; g.fillRect(60, 206, 470, 4);
    g.fillStyle = "#2a1418"; g.font = '600 22px Montserrat, Arial, sans-serif'; g.fillText("TAPE COUNTER", 236, 420); g.fillText("POWER", 858, 236);
    for (let i = 0; i < 7; i++) { g.fillStyle = "#151314"; roundRect(g, 700 + i * 38, 450, 18, 150, 9); g.fill(); }
  });
  add(new THREE.BoxGeometry(10.6, 0.12, 6.6), new THREE.MeshPhysicalMaterial({ map: plateTex, metalness: 0.85, roughness: 0.32 }), 5.95, 2.16, 0.0);
  const counterTex = canvasTex(300, 110, () => {});
  const drawCounter = n => { const g = counterTex.userData.canvas.getContext("2d"); g.fillStyle = "#0b0a0a"; g.fillRect(0, 0, 300, 110);
    String(n % 1000).padStart(3, "0").split("").forEach((d, i) => { g.fillStyle = "#1d1a1a"; g.fillRect(14 + i * 94, 10, 82, 90); g.fillStyle = "#f4eadb"; g.font = 'bold 70px "Courier New", monospace'; g.textAlign = "center"; g.fillText(d, 55 + i * 94, 80); });
    counterTex.needsUpdate = true; };
  drawCounter(0);
  add(new THREE.BoxGeometry(3.6, 0.2, 1.4), plasticDark, 3.8, 2.24, 1.95);
  add(new THREE.PlaneGeometry(3.2, 1.15), new THREE.MeshPhysicalMaterial({ map: counterTex, roughness: 0.2, clearcoat: 1 }), 3.8, 2.35, 1.95).rotation.x = -Math.PI / 2;
  const ledMat = new THREE.MeshStandardMaterial({ color: 0x3a0d12, emissive: 0xd33043, emissiveIntensity: 0 });
  add(new THREE.CylinderGeometry(0.3, 0.3, 0.25, 24), ledMat, 9.9, 2.25, -1.55);

  /* ---- key labels and piano keys ---- */
  const KEYS = [["rew", "Rewind 15s"], ["play", "Play"], ["pause", "Pause"], ["ff", "F.F. 15s"], ["eject", "Stop/Eject"]];
  const keyX = i => -8.4 + i * 4.2;
  const labelTex = canvasTex(2048, 92, (g, w, h) => {
    brushed(g, w, h, "#c4c3c6"); g.fillStyle = "#2a1418"; g.font = '600 38px Montserrat, Arial, sans-serif'; g.textAlign = "center";
    KEYS.forEach(([, label], i) => g.fillText(label, (keyX(i) + 11.2) / 22.4 * w, 46));
  });
  add(new THREE.BoxGeometry(22.4, 0.1, 0.9), new THREE.MeshPhysicalMaterial({ map: labelTex, metalness: 0.85, roughness: 0.32 }), 0, 2.15, 3.85);
  add(new THREE.BoxGeometry(21.6, 1.0, 3.4), plasticDark, 0, 1.75, 6.15);
  const keyMeshes = KEYS.map(([action], i) => {
    const k = add(new RoundedBoxGeometry(3.9, 1.1, 3.3, 3, 0.18), metal, keyX(i), 2.2, 6.3);
    k.userData = { action, base: 2.2, tap: 0 };
    // printed symbol on each key: ◀◀  ▶  ❚❚  ▶▶
    const ink = action === "play" ? 0xd33043 : 0x2a1418, sym = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: ink, roughness: 0.5 });
    const tri = (cx, dir) => { const s = new THREE.Shape(); s.moveTo(cx - .3 * dir, -.32); s.lineTo(cx - .3 * dir, .32); s.lineTo(cx + .3 * dir, 0); s.closePath(); sym.add(new THREE.Mesh(new THREE.ShapeGeometry(s), mat)); };
    const bar = cx => { const s = new THREE.Shape(); s.moveTo(cx - .1, -.32); s.lineTo(cx + .1, -.32); s.lineTo(cx + .1, .32); s.lineTo(cx - .1, .32); s.closePath(); sym.add(new THREE.Mesh(new THREE.ShapeGeometry(s), mat)); };
    if (action === "rew") { tri(-.3, -1); tri(.3, -1); } if (action === "ff") { tri(-.3, 1); tri(.3, 1); }
    if (action === "play") tri(0, 1); if (action === "pause") { bar(-.2); bar(.2); }
    if (action === "eject") {
      const up = new THREE.Shape(); up.moveTo(-.32, -.02); up.lineTo(.32, -.02); up.lineTo(0, .36); up.closePath(); sym.add(new THREE.Mesh(new THREE.ShapeGeometry(up), mat));
      const base = new THREE.Shape(); base.moveTo(-.32, -.32); base.lineTo(.32, -.32); base.lineTo(.32, -.16); base.lineTo(-.32, -.16); base.closePath(); sym.add(new THREE.Mesh(new THREE.ShapeGeometry(base), mat));
    }
    sym.rotation.x = -Math.PI / 2; sym.position.set(0, 0.56, 0.3); k.add(sym);
    return k;
  });

  /* ---- carry handle ---- */
  const tube = (len, x, y, z, rot) => { const m = add(new THREE.CylinderGeometry(0.32, 0.32, len, 20), rubber, x, y, z); m.rotation.z = rot.z || 0; m.rotation.x = rot.x || 0; return m; };
  tube(8.4, 13.9, 0, -0.5, { x: Math.PI / 2 });
  tube(1.9, 12.95, 0, -4.7, { z: Math.PI / 2 }); tube(1.9, 12.95, 0, 3.7, { z: Math.PI / 2 });

  /* ---- the cassette inside ---- */
  function makeCassette(color, title) {
    const g = new THREE.Group();
    const shell = new THREE.Mesh(new RoundedBoxGeometry(9.4, 0.7, 5.9, 3, 0.14), new THREE.MeshPhysicalMaterial({ color, roughness: 0.38, clearcoat: 0.5, clearcoatRoughness: 0.3 }));
    shell.castShadow = shell.receiveShadow = true; g.add(shell);
    const tex = canvasTex(1024, 634, (c, w, h) => {
      c.clearRect(0, 0, w, h);
      c.fillStyle = "#f4eadb"; roundRect(c, 60, 36, 904, 300, 22); c.fill();
      c.fillStyle = "#a9bf95"; c.fillRect(60, 252, 904, 18); c.fillStyle = "#f3d7dc"; c.fillRect(60, 270, 904, 18); c.fillStyle = "#8e2a3b"; c.fillRect(60, 288, 904, 10);
      c.fillStyle = "#2a1418"; c.textAlign = "center"; c.font = '64px "Special Elite", "Courier New", monospace';
      let t = title; while (c.measureText(t).width > 820 && t.length > 4) t = t.slice(0, -2); if (t !== title) t = t.trim() + "…";
      c.fillText(t, w / 2, 170);
      c.font = '600 24px Montserrat, Arial, sans-serif'; c.textAlign = "left"; c.fillText("THE DESCARTES LIBRARY", 96, 90); c.textAlign = "right"; c.fillText("SIDE A", 928, 90);
      c.fillStyle = "#0d0b0c"; roundRect(c, 265, 355, 494, 175, 30); c.fill();
      c.save(); roundRect(c, 265, 355, 494, 175, 30); c.clip();
      c.fillStyle = "#3e2f24"; c.beginPath(); c.arc(369, 437, 118, 0, 7); c.fill(); c.beginPath(); c.arc(655, 437, 88, 0, 7); c.fill(); c.restore();
      c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.moveTo(220, 560); c.lineTo(804, 560); c.lineTo(850, 634); c.lineTo(174, 634); c.closePath(); c.fill();
      [[34, 34], [990, 34], [34, 600], [990, 600], [512, 590]].forEach(([x, y]) => { c.fillStyle = "rgba(0,0,0,.35)"; c.beginPath(); c.arc(x, y, 13, 0, 7); c.fill(); });
    });
    const top = new THREE.Mesh(new THREE.PlaneGeometry(9.4, 5.9), new THREE.MeshPhysicalMaterial({ map: tex, transparent: true, roughness: 0.45, clearcoat: 0.4 }));
    top.rotation.x = -Math.PI / 2; top.position.y = 0.352; g.add(top);
    g.userData.hubs = [-1.29, 1.29].map(x => {
      const hub = new THREE.Group(); hub.position.set(x, 0.37, 1.08); g.add(hub);
      hub.add(new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.05, 32), new THREE.MeshStandardMaterial({ color: 0xf4eadb, roughness: 0.5 })));
      for (let k = 0; k < 6; k++) { const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.07, 0.2), new THREE.MeshStandardMaterial({ color: 0x1a1517 })); const a = k * Math.PI / 3; tooth.position.set(Math.cos(a) * 0.3, 0.02, Math.sin(a) * 0.3); tooth.rotation.y = -a; hub.add(tooth); }
      return hub;
    });
    return g;
  }

  /* ---- tiny tween engine ---- */
  const tweens = [];
  const tween = (obj, k, to, dur) => new Promise(res => tweens.push({ obj, k, from: obj[k], to, dur: reduceMotion ? 0.01 : dur, t: 0, res }));
  let tape = null, chain = Promise.resolve(), ejected = false;
  async function doInsert(color, title) {
    await tween(lid.rotation, "x", -0.9, 0.45);
    if (tape) { const old = tape; await tween(old.position, "y", 10, 0.4); rig.remove(old); }
    tape = makeCassette(color, title); tape.position.set(-5.6, 10, 0.1); rig.add(tape);
    await tween(tape.position, "y", 2.47, 0.55);
    await tween(lid.rotation, "x", 0, 0.4);
    ejected = false;
  }
  // eject: the lid pops open and the cassette lifts up, tilted, ready to grab
  async function doEject() {
    await tween(lid.rotation, "x", -0.9, 0.4);
    if (tape) { tween(tape.rotation, "x", -0.18, 0.35); await tween(tape.position, "y", 3.9, 0.35); }
    ejected = true;
  }
  async function doClose() {
    if (tape) { tween(tape.rotation, "x", 0, 0.3); await tween(tape.position, "y", 2.47, 0.3); }
    await tween(lid.rotation, "x", 0, 0.4);
    ejected = false;
  }
  deck = {
    insert: (c, t) => (chain = chain.then(() => doInsert(c, t))),
    eject: () => (chain = chain.then(() => (ejected ? doClose() : doEject()))),
    close: () => (chain = chain.then(() => (ejected ? doClose() : null))),
    isEjected: () => ejected,
    tap: () => {},
  };

  /* ---- clicking the 3D keys ---- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), mouse = { x: 0, y: 0 };
  const pick = e => { const r = renderer.domElement.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, camera); return ray.intersectObjects([...keyMeshes, ...lidParts], true)[0]; };
  renderer.domElement.addEventListener("pointermove", e => { el.style.cursor = pick(e) ? "pointer" : "default"; });
  renderer.domElement.addEventListener("click", e => {
    const hit = pick(e); if (!hit) return;
    if (lidParts.includes(hit.object)) { chain = chain.then(async () => { await tween(lid.rotation, "x", -0.9, 0.45); await new Promise(r => setTimeout(r, 900)); await tween(lid.rotation, "x", 0, 0.4); }); return; }
    let o = hit.object; while (o && !o.userData.action) o = o.parent;
    if (!o) return;
    o.userData.tap = 0.25; keyAction(o.userData.action);
  });
  deck.tap = action => { const k = keyMeshes.find(m => m.userData.action === action); if (k) k.userData.tap = 0.25; };
  addEventListener("pointermove", e => { mouse.x = e.clientX / innerWidth - 0.5; mouse.y = e.clientY / innerHeight - 0.5; });

  /* ---- sizing, render loop ---- */
  const resize = () => { const w = el.clientWidth, h = el.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(el); resize();
  let visible = true; new IntersectionObserver(([en]) => (visible = en.isIntersecting)).observe(el);
  const clock = new THREE.Clock(); let lastCount = -1;
  (function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (!visible) return;
    for (let i = tweens.length - 1; i >= 0; i--) { const w = tweens[i]; w.t += dt; const p = Math.min(1, w.t / w.dur), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; w.obj[w.k] = w.from + (w.to - w.from) * e; if (p >= 1) { tweens.splice(i, 1); w.res(); } }
    keyMeshes.forEach(k => {
      const held = (k.userData.action === "play" && isPlaying) || (k.userData.action === "pause" && !isPlaying && audio.currentTime > 0 && !audio.ended);
      const target = k.userData.base - (held || k.userData.tap > 0 ? 0.36 : 0);
      k.position.y += (target - k.position.y) * Math.min(1, dt * 18); if (k.userData.tap > 0) k.userData.tap -= dt;
    });
    let spd = isPlaying ? 2.4 : 0; if (fastSpin > 0) { spd = 14 * fastDir; fastSpin -= dt; }
    if (tape) tape.userData.hubs.forEach(h => (h.rotation.y -= spd * dt));
    ledMat.emissiveIntensity += ((isPlaying ? 2.2 : 0) - ledMat.emissiveIntensity) * Math.min(1, dt * 10);
    const count = Math.floor(audio.currentTime || 0); if (count !== lastCount) { lastCount = count; drawCounter(count); }
    if (!reduceMotion) { camera.position.x += ((1 + mouse.x * 6) - camera.position.x) * Math.min(1, dt * 2); camera.position.y += ((30 - mouse.y * 3) - camera.position.y) * Math.min(1, dt * 2); camera.lookAt(0.5, -0.8, 1.2); }
    renderer.render(scene, camera);
  })();
}

/* ================= low-poly cassette (for the carousel) ================= */
const hex = (cx, cy, r, rot = 0) => Array.from({ length: 6 }, (_, k) => { const a = rot + k * Math.PI / 3; return `${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`; }).join(" ");
function tapeSVG(color, back) {
  const hub = (cx, cy) => `<g class="hub"><polygon points="${hex(cx, cy, 10, .3)}" fill="#f4eadb"/><polygon points="${hex(cx, cy, 4, .3)}" fill="#1a1517"/>${[0, 2.094, 4.189].map(a => `<rect x="${(cx + Math.cos(a) * 6.5 - 1.5).toFixed(1)}" y="${(cy + Math.sin(a) * 6.5 - 1.5).toFixed(1)}" width="3" height="3" fill="#1a1517"/>`).join("")}</g>`;
  return `<svg width="240" height="150" viewBox="0 0 240 150" aria-hidden="true">
    <polygon points="8,0 232,0 240,8 240,142 232,150 8,150 0,142 0,8" fill="${color}"/>
    <polygon points="0,8 8,0 120,0 0,80" fill="#fff" opacity=".07"/><polygon points="240,70 240,142 232,150 150,150" fill="#000" opacity=".12"/>
    <polygon points="120,0 232,0 240,8 240,70" fill="#fff" opacity=".03"/><polygon points="0,80 0,142 8,150 90,150" fill="#000" opacity=".06"/>
    <polygon points="22,12 218,12 226,20 226,64 218,72 22,72 14,64 14,20" fill="${back ? "#e9dfcf" : "#f4eadb"}"/>
    <rect x="14" y="56" width="212" height="5" fill="#a9bf95"/><rect x="14" y="61" width="212" height="5" fill="#f3d7dc"/><rect x="14" y="66" width="212" height="3" fill="#8e2a3b"/>
    <polygon points="72,82 168,82 176,90 176,112 168,120 72,120 64,112 64,90" fill="#0d0b0c"/>
    <polygon points="${hex(94, 101, 17)}" fill="#3e2f24"/><polygon points="${hex(146, 101, 12)}" fill="#3e2f24"/>
    ${hub(94, 101)}${hub(146, 101)}
    <polygon points="52,128 188,128 198,150 42,150" fill="#000" opacity=".22"/>
    <rect x="72" y="138" width="7" height="7" fill="#0d0b0c"/><rect x="161" y="138" width="7" height="7" fill="#0d0b0c"/>
    ${[[9, 9], [231, 9], [9, 141], [231, 141]].map(([x, y]) => `<polygon points="${hex(x, y, 3.5)}" fill="#000" opacity=".35"/>`).join("")}

}

/* ================= page wiring ================= */
let STORIES = [], current = 0;
const fmt = s => (!isFinite(s) ? "0:00" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"));
function setRunner(title) { const g = '<span class="glyph">𓇢𓆸</span>'; $("runner").innerHTML = `now playing: ${title.replace(/[<>&]/g, "")} ${g} the descartes library ${g} `.repeat(6); }

function load(i, autoplay) {
  const s = STORIES[i]; if (!s) return;
  current = i; audio.src = s.file; $("error").textContent = "";
  $("storyTitle").textContent = s.title; $("storyBlurb").textContent = s.blurb || "";
  $("seek").value = 0; $("cur").textContent = "0:00"; $("dur").textContent = "0:00";
  setRunner(s.title); deck.insert(colorFor(i), s.title);
  document.querySelectorAll(".tape").forEach((el, n) => el.setAttribute("aria-current", n === i ? "true" : "false"));
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: "I.N. Descartes", album: "The Descartes Library" });
  if (autoplay) audio.play().catch(() => {});
}

function keyAction(a) {
  if (!STORIES.length) return;
  if (a === "play") { if (deck.isEjected()) deck.close(); audio.play().catch(() => {}); }
  if (a === "pause") audio.pause();
  if (a === "eject") { audio.pause(); audio.currentTime = 0; deck.eject(); }
  if (a === "rew") { audio.currentTime = Math.max(0, audio.currentTime - 15); fastSpin = 0.5; fastDir = -1; }
  if (a === "ff" && audio.duration) { audio.currentTime = Math.min(audio.duration, audio.currentTime + 15); fastSpin = 0.5; fastDir = 1; }
}

function buildCarousel() {
  const car = $("carousel");
  if (!STORIES.length) { car.innerHTML = '<p class="empty">no tapes on the shelf yet. check back soon.</p>'; return; }
  STORIES.forEach((s, i) => {
    const col = colorFor(i), b = document.createElement("button");
    b.className = "tape"; b.type = "button"; b.setAttribute("aria-label", `Play ${s.title}`);
    b.innerHTML = `
      <div class="tape-stage">
        <div class="tape-shadow"></div>
        <div class="float"><div class="spinner">
          <div class="face f-front">${tapeSVG(col, false)}<span class="tape-label"></span></div>
          <div class="face f-back">${tapeSVG(shade(col, .85), true)}<span class="tape-label">side b ✶ the descartes library</span></div>
          <div class="face f-top" style="background:${shade(col, 1.3)}"></div>
          <div class="face f-bottom" style="background:${shade(col, .5)}"></div>
          <div class="face f-left" style="background:${shade(col, .68)}"></div>
          <div class="face f-right" style="background:${shade(col, .8)}"></div>
        </div></div>
      </div>
      <div class="tape-info"><p class="tape-title"></p><p class="tape-desc"></p><span class="tape-cta">▶ press to play</span></div>`;
    b.querySelector(".f-front .tape-label").textContent = s.title;
    b.querySelector(".tape-title").textContent = s.title;
    b.querySelector(".tape-desc").textContent = s.blurb || "";
    const on = () => document.body.classList.add("dim"), off = () => document.body.classList.remove("dim");
    b.addEventListener("mouseenter", on); b.addEventListener("mouseleave", off);
    b.addEventListener("focus", () => { if (b.matches(":focus-visible")) on(); }); b.addEventListener("blur", off);
    b.addEventListener("click", () => { off(); load(i, true); window.scrollTo({ top: $("deck").getBoundingClientRect().top + scrollY - 30, behavior: "smooth" }); });
    car.appendChild(b);
  });
}

$("prevBtn").addEventListener("click", () => $("carousel").scrollBy({ left: -316 }));
$("nextBtn").addEventListener("click", () => $("carousel").scrollBy({ left: 316 }));
// keyboard: Space plays/pauses, arrows skip 15 seconds (when the recorder is focused)
$("deck").addEventListener("keydown", e => {
  const map = { " ": audio.paused ? "play" : "pause", Enter: audio.paused ? "play" : "pause", ArrowLeft: "rew", ArrowRight: "ff", e: "eject", E: "eject" };
  const a = map[e.key]; if (!a) return; e.preventDefault(); deck.tap(a); keyAction(a);
});
$("seek").addEventListener("input", () => { if (audio.duration) audio.currentTime = $("seek").value / 100 * audio.duration; });
audio.addEventListener("play", () => { isPlaying = true; });
audio.addEventListener("pause", () => { isPlaying = false; });
audio.addEventListener("ended", () => { isPlaying = false; });
audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); });
audio.addEventListener("timeupdate", () => { $("cur").textContent = fmt(audio.currentTime); if (audio.duration) $("seek").value = audio.currentTime / audio.duration * 100; });
audio.addEventListener("error", () => { if (STORIES[current]) $("error").textContent = `Can't play "${decodeURIComponent(STORIES[current].file)}". Check the file finished uploading.`; });

setRunner("the listening room");
await initDeck();
STORIES = (await loadStories()) || [];
buildCarousel();
if (STORIES.length) load(0, false);
else { $("storyTitle").textContent = "the shelf is empty"; $("storyBlurb").textContent = "New stories are on the way."; }
</script>
</body>
